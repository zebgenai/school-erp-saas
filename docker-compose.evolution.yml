# Optional local Evolution API + Baileys stack for Clever Campus WhatsApp.
# Does NOT modify the main Clever Campus compose stack or its volumes.
#
# Usage (local only — do NOT deploy to production VPS yet):
#   docker compose -f docker-compose.evolution.yml --env-file .env.evolution.example up -d
#
# Backend (when enabling WhatsApp later):
#   WHATSAPP_ENABLED=true
#   WHATSAPP_PROVIDER=evolution
#   EVOLUTION_API_URL=http://127.0.0.1:8080
#   EVOLUTION_API_KEY=<same as EVOLUTION_API_KEY below>
#   EVOLUTION_INSTANCE_ID=<instance name created in Evolution>
#   EVOLUTION_WEBHOOK_SECRET=<shared secret>
#
# After Evolution is up, create an instance and configure webhook via Evolution API:
#   POST /instance/create
#   POST /webhook/set/{instance}
#     {
#       "enabled": true,
#       "url": "http://host.docker.internal:3000/webhooks/whatsapp/evolution",
#       "events": ["MESSAGES_UPDATE"],
#       "headers": { "x-evolution-webhook-secret": "<EVOLUTION_WEBHOOK_SECRET>" }
#     }
#
# Image tag: pin to the verified API contract. Confirm the tag exists on Docker Hub
# before use. If unavailable, STOP — do not silently use :latest in production.

name: clever-campus-evolution

services:
  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVOLUTION_POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?Set EVOLUTION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EVOLUTION_POSTGRES_DB:-evolution}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${EVOLUTION_POSTGRES_USER:-evolution} -d ${EVOLUTION_POSTGRES_DB:-evolution}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --port 6379
    volumes:
      - evolution_redis_data:/data
    networks:
      - evolution_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    # Verified API contract source: EvolutionAPI/evolution-api @ 2.3.7
    image: ${EVOLUTION_DOCKER_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://127.0.0.1:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Set EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_POSTGRES_USER:-evolution}:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/${EVOLUTION_POSTGRES_DB:-evolution}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: clever_campus_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      LANGUAGE: en
      CONFIG_SESSION_PHONE_CLIENT: CleverCampus
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes:
      # Baileys / WhatsApp session + instance auth state (never commit)
      - evolution_instances_data:/evolution/instances
    networks:
      - evolution_net
    # Localhost only — not on host 80/443
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  evolution_postgres_data:
  evolution_redis_data:
  evolution_instances_data:

networks:
  evolution_net:
    name: clever_campus_evolution_net
    driver: bridge
